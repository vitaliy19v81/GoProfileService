syntax = "proto3";
package profile;

option go_package = "/annotation_proto";

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";


// Сообщение профиля
message Profile {
  string id = 1;
  string user_id = 2;
  string first_name = 3;
  string last_name = 4;
  string middle_name = 5;
  string phone = 6;
  string address = 7;
  string birthday = 8;
  map<string, string> additional_data = 9;
  string created_at = 10;
  string updated_at = 11;

}

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  security_definitions: {
    security: {
      key: "bearerAuth"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "Bearer token"
      }
    }
  }
};

// Сервис профилей
service ProfileService {
  // Получение профиля по токену
  rpc GetProfileByToken(GetProfileByTokenRequest) returns (GetProfileByTokenResponse) {
    option (google.api.http) = {
      get: "/v1/profiles/token"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get profile by token";
      description: "Retrieves a profile using the authorization token from the header.";
      security: {
        security_requirement: {
          key: "bearerAuth"
          value: {}
        }
      }
    };

  }

  // Получение профиля по id
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse) {
    option (google.api.http) = {
      get: "/v1/profiles/id/{id}"
    };
  }

  // Получение профиля по user_id
  rpc GetProfileByUserID(GetProfileByUserIDRequest) returns (GetProfileByUserIDResponse) {
    option (google.api.http) = {
      get: "/v1/profiles/userid/{user_id}"
    };
  }

  // Создание профиля
  rpc CreateProfile(CreateProfileRequest) returns (CreateProfileResponse) {
    option (google.api.http) = {
      post: "/v1/profiles"
      body: "*"
    };
  }

  // Получение списка профилей
  rpc GetProfiles(GetProfilesRequest) returns (GetProfilesResponse) {
    option (google.api.http) = {
      get: "/v1/profiles"
    };
  }

  // Удаление профиля по id
  rpc DeleteProfileByID(DeleteProfileByIDRequest) returns (DeleteProfileByIDResponse) {
    option (google.api.http) = {
      delete: "/v1/profiles/delete/id/{id}"
    };
  }

  // Обновление профиля
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse) {
    option (google.api.http) = {
      put: "/v1/profiles/update/id/{user_id}"
      body: "*"
    };
  }

}

// Запрос для получения профиля через токен
message GetProfileByTokenRequest {
  string token = 1;
}

// Ответ с данными профиля
message GetProfileByTokenResponse {
  Profile profile = 1;
  string error = 2;
}

// Запрос для получения профиля
message GetProfileRequest {
  string id = 1;
}

// Ответ для получения профиля
message GetProfileResponse {
  Profile profile = 1;
}

// Запрос для получения профиля
message GetProfileByUserIDRequest {
  string user_id = 1;
}

// Ответ для получения профиля
message GetProfileByUserIDResponse {
  Profile profile = 1;
}

// Запрос для создания профиля
message CreateProfileRequest {
  string user_id = 1;
  string first_name = 2;
  string last_name = 3;
  string middle_name = 4;
  string phone = 5;
  string address = 6;
  string birthday = 7;
  map<string, string> additional_data = 8;
}

// Ответ для создания профиля
message CreateProfileResponse {
  string id = 1;
  string created_at = 2;
  string updated_at = 3;
}

// Запрос для получения списка профилей
message GetProfilesRequest {
  string limit = 1;
  string offset = 2;
}

// Ответ для получения списка профилей
message GetProfilesResponse {
  repeated Profile profiles = 1; // Список профилей
  int32 totalRecords = 2;       // Общее количество записей
}

// Запрос для удаления профиля
message DeleteProfileByIDRequest {
  string id = 1;
}

// Ответ для удаления профиля
message DeleteProfileByIDResponse {
  string message = 1;
}

// Запрос для обновление профиля
message UpdateProfileRequest {
  string user_id = 1;
  string first_name = 2;
  string last_name = 3;
  string middle_name = 4;
  string phone = 5;
  string address = 6;
  string birthday = 7;
  map<string, string> additional_data = 8;
}

// Ответ для обновления профиля
message UpdateProfileResponse {
  bool success = 1;
  string message = 2;
}
